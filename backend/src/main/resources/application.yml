spring:
  application:
    name: commerce-operations-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_operations}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.commerceoperations: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: never
    info:
      access: read-only
    metrics:
      access: read-only

outbox:
  worker:
    enabled: ${OUTBOX_WORKER_ENABLED:true}
    poll-delay: ${OUTBOX_WORKER_POLL_DELAY:PT2S}
    claim-lease: ${OUTBOX_WORKER_CLAIM_LEASE:PT30S}
    max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:5}

security:
  users:
    seller1:
      seller-id: ${SECURITY_SELLER1_ID}
      password: ${SECURITY_SELLER1_PASSWORD}
    seller2:
      seller-id: ${SECURITY_SELLER2_ID}
      password: ${SECURITY_SELLER2_PASSWORD}
